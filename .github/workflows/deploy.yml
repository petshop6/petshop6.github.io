# Builds the site and publishes dist/ to GitHub Pages on every push to main.
# SITE_URL is read by astro.config.mjs (canonical links, sitemap, OG). When the
# shop's own domain is attached, set the SITE_URL repository variable.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: withastro/action@v5
        with:
          node-version: 22
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://petshop6.github.io' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
